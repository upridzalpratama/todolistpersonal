<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Questline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>
:root{
  --bg:#0e1116;--surface:#161b23;--surface-2:#1e2531;--border:#2b3444;--text:#e8ecf2;--muted:#a1abbd;
  --accent:#f5a524;--accent-ink:#1a1200;--accent-text:#f7b84a;--xp:#9b7bff;--hp:#f2557a;--ok:#35c97a;--danger:#ff7676;
  --heat0:#1e2531;--heat1:#264d3a;--heat2:#2f7a52;--heat3:#35a86a;--heat4:#4fd98a;
  --shadow:0 10px 32px rgba(0,0,0,.4);--radius:14px;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme=light]{
  --bg:#f3f5f9;--surface:#ffffff;--surface-2:#edf0f5;--border:#d5dbe5;--text:#141922;--muted:#525d6f;
  --accent:#f5a524;--accent-ink:#1a1200;--accent-text:#8a5200;--xp:#6a4fd6;--hp:#c9284f;--ok:#167a45;--danger:#c0262b;
  --heat0:#e3e8ef;--heat1:#b7e4c7;--heat2:#74c69d;--heat3:#40a26a;--heat4:#1f7a4a;
  --shadow:0 10px 32px rgba(20,30,50,.14);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* HUD */
#hud{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.hud{display:flex;align-items:center;gap:16px;padding:10px 0;flex-wrap:wrap}
.hud-id{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{font-size:26px;width:44px;height:44px;display:grid;place-items:center;background:var(--surface-2);border-radius:12px;flex:none}
.hud-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.hud-lv{font-size:12px;color:var(--muted)}
.hud-xp{flex:1;min-width:140px}
.hud-xp-label{font-size:12px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}
.hud-stats{display:flex;align-items:center;gap:6px}
.stat{display:inline-flex;align-items:center;gap:4px;padding:0 10px;height:36px;border-radius:999px;background:var(--surface-2);font-size:14px;white-space:nowrap}
.stat.warn{box-shadow:inset 0 0 0 1px var(--accent)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.bar .fill{height:100%;border-radius:inherit;background:var(--c,var(--accent));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar.xp .fill{background:linear-gradient(90deg,var(--xp),color-mix(in srgb,var(--xp) 60%,#fff))}
.bar.hp .fill{background:linear-gradient(90deg,var(--hp),color-mix(in srgb,var(--hp) 70%,#ffb347))}
.bar.thin{height:6px}
.bar.big{height:14px}

/* Tabs */
#tabs{display:flex;gap:4px;padding:10px 0 0}
.tab{flex:none;min-height:44px;padding:0 18px;border:0;border-radius:10px 10px 0 0;background:transparent;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:8px;border-bottom:2px solid transparent}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.tab .kbd{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:0 5px}
main{padding:18px 0 48px}

/* Generic */
.icon-btn{width:44px;height:44px;border-radius:10px;border:0;background:transparent;display:inline-grid;place-items:center;font-size:18px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.sm{width:36px;height:36px;font-size:15px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.easy{color:var(--ok)}.pill.medium{color:var(--accent-text)}.pill.hard{color:var(--hp)}
.pill.xp{color:var(--xp)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));flex:none;display:inline-block}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:20px}
h3{font-size:16px}
.section-title{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:650}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:12px}
.banner .grow{flex:1;min-width:200px}
.banner.accent{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}

/* Forms */
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);width:100%;color:var(--text)}
input::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent)}
.form-grid{display:grid;gap:12px}
.form-grid.two{grid-template-columns:1fr 1fr}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{position:relative}
.swatch input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.swatch span{display:block;width:36px;height:36px;border-radius:10px;background:var(--c);border:2px solid transparent}
.swatch input:checked+span{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.swatch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-size:14px}
.chip.emoji span{font-size:22px}
.chip input:checked+span{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface-2))}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* Daily */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.datebar h2{flex:1;min-width:180px}
.quick{display:grid;gap:8px;grid-template-columns:1fr auto auto auto auto;align-items:center;margin-bottom:8px}
.quick-days{margin:-2px 0 10px}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.summary .stat{background:var(--surface);border:1px solid var(--border)}
.group{margin-top:18px}
.group-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.group-head h3{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--c,var(--border));position:relative}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.task-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:4px 0}
.task-title{overflow-wrap:anywhere}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task-actions{display:flex}
.check{width:44px;height:44px;flex:none;border:0;background:transparent;display:grid;place-items:center;padding:0}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--c,var(--muted));display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s}
.check .box svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:opacity .15s,transform .15s}
.check[aria-checked=true] .box{background:var(--c,var(--ok));border-color:var(--c,var(--ok))}
.check[aria-checked=true] .box svg{opacity:1;transform:scale(1)}
.check:active .box{transform:scale(.9)}
details.more{margin-top:24px}
details.more summary{cursor:pointer;color:var(--muted);min-height:44px;display:flex;align-items:center}

/* Quest & Epic cards */
.qcard{border-top:4px solid var(--c,var(--border));display:flex;flex-direction:column;gap:10px}
.qcard.closed{opacity:.6}
.qcard .boss{display:flex;align-items:center;gap:10px}
.qcard .boss .face{font-size:30px;line-height:1;transition:transform .3s}
.qcard.defeated .boss .face{filter:grayscale(1);transform:rotate(-12deg)}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.qcard .tasks .task{padding:2px 4px 2px 8px}
.qcard .check{width:40px;height:40px}
.card-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.yearhead{display:grid;gap:12px;grid-template-columns:2fr 1fr 1fr 1fr}
.bigstat{font-size:26px;font-weight:700}

/* Heatmap */
.heat-wrap{overflow-x:auto;padding-bottom:6px}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;width:max-content}
.heat i{display:block;width:12px;height:12px;border-radius:3px;background:var(--heat0)}
.heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--heat3)}.heat i.l4{background:var(--heat4)}
.heat i.pad{background:transparent}
.heat i.today{outline:1.5px solid var(--text);outline-offset:-1px}
.heat-months{display:grid;grid-auto-flow:column;grid-auto-columns:12px;gap:3px;font-size:11px;color:var(--muted);height:16px;width:max-content}
.heat-months span{white-space:nowrap;overflow:visible}
.legend{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Badges */
.badges{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.badge{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.badge .ic{font-size:26px}
.badge.locked{opacity:.55}
.badge.locked .ic{filter:grayscale(1)}
.badge b{display:block;font-size:14px}
.badge span{font-size:12px;color:var(--muted)}

/* Modal */
#modal-root[hidden]{display:none}
.backdrop{position:fixed;inset:0;background:rgba(5,8,12,.6);z-index:50}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);animation:pop .18s ease-out}
.modal.wide{width:min(760px,calc(100vw - 24px))}
.modal-head{display:flex;align-items:center;gap:8px;padding:14px 14px 0 20px}
.modal-head h2{flex:1;font-size:18px}
.modal-body{padding:14px 20px 20px}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:10px}
.list li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:10px 0}
.statgrid .card{padding:12px}
.statgrid b{display:block;font-size:22px}
.search-results{margin-top:10px}
.search-results button{width:100%;text-align:left;border:0;background:var(--surface-2);border-radius:10px;padding:10px 12px;min-height:44px;display:flex;gap:10px;align-items:center}
.search-results button:hover,.search-results button:focus-visible{background:var(--border)}

/* Toasts & effects */
#toasts{position:fixed;z-index:60;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;max-width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);animation:toastIn .25s ease-out;position:relative}
.toast.error{border-left-color:var(--danger)}
.toast.badge{border-left-color:var(--xp)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.xp-float{position:fixed;z-index:70;pointer-events:none;font-weight:800;color:var(--xp);font-size:15px;animation:floatUp .55s ease-out forwards;text-shadow:0 1px 6px rgba(0,0,0,.35)}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
.confetti{position:fixed;z-index:71;width:7px;height:10px;border-radius:2px;pointer-events:none;animation:conf .9s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

@media (max-width:767px){
  body{font-size:15px}
  .hud-id{flex:1}
  .hud-name{max-width:110px}
  .hud-stats .icon-btn{width:40px}
  .stat{padding:0 8px}
  .hud{gap:8px 10px}
  .hud-xp{order:3;flex-basis:100%}
  .hud-stats{margin-left:auto}
  .hud-stats .icon-btn.opt{display:none}
  #tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:4px 8px calc(4px + env(safe-area-inset-bottom));justify-content:space-around}
  .tab{flex:1;justify-content:center;border-radius:10px;border-bottom:0;min-height:52px;flex-direction:column;gap:0;font-size:12px}
  .tab .ico{font-size:18px}
  .tab[aria-selected=true]{background:var(--surface-2)}
  .tab .kbd{display:none}
  main{padding-bottom:96px}
  #toasts{bottom:84px}
  .quick{grid-template-columns:1fr 1fr}
  .quick input[name=title]{grid-column:1/-1}
  .quick .btn{grid-column:1/-1}
  .form-grid.two{grid-template-columns:1fr}
  .yearhead{grid-template-columns:1fr 1fr}
  .yearhead > :first-child{grid-column:1/-1}
  .grid{grid-template-columns:1fr}
}
@media (min-width:768px){ .tab .ico{font-size:16px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<a href="#view" class="sr-only">Lompat ke konten</a>
<header id="hud"><div class="wrap"><div class="hud" id="hud-inner"></div></div></header>
<div class="wrap">
  <nav id="tabs" role="tablist" aria-label="Tampilan">
    <button class="tab" role="tab" data-act="tab" data-view="daily" id="tab-daily" aria-controls="view"><span class="ico" aria-hidden="true">☀️</span>Harian <span class="kbd">1</span></button>
    <button class="tab" role="tab" data-act="tab" data-view="monthly" id="tab-monthly" aria-controls="view"><span class="ico" aria-hidden="true">🗓️</span>Bulanan <span class="kbd">2</span></button>
    <button class="tab" role="tab" data-act="tab" data-view="yearly" id="tab-yearly" aria-controls="view"><span class="ico" aria-hidden="true">🏔️</span>Tahunan <span class="kbd">3</span></button>
  </nav>
  <main id="view" role="tabpanel" tabindex="-1"></main>
</div>
<div id="modal-root" hidden></div>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="sr" class="sr-only" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============================================================
   Questline — to-do & goals gamified. Semua data di localStorage.
   ============================================================ */
const KEY = 'questline.v1';
const BACKUP_KEY = 'questline.v1.backup';
const SCHEMA = 1;
const MAX_ACTIVE_EPICS = 5;
const MIN_QUEST_TASKS = 3; // minimal task agar bonus Quest & Boss berlaku (anti-akal-akalan)
const MIN_EPIC_QUESTS = 3; // minimal Quest tuntas agar Epic dianggap tuntas

const DIFF = { easy: { label: 'Mudah', mult: 1 }, medium: { label: 'Sedang', mult: 1.5 }, hard: { label: 'Sulit', mult: 2.5 } };
const COLORS = { amber: '#f5a524', emerald: '#2fbf71', sky: '#38a8f5', violet: '#9b7bff', rose: '#f2557a', teal: '#22c2b5' };
const NEUTRAL = '#8a94a6';
const AVATARS = ['🧙', '🦊', '🐉', '🦁', '🐺', '🦉', '🤖', '🧝', '🥷', '🐼', '🦄', '🚀'];
const CATEGORIES = ['Karier', 'Kesehatan', 'Keuangan', 'Belajar', 'Relasi', 'Hobi', 'Spiritual', 'Bisnis'];
const BOSSES = ['👹', '🐲', '👾', '🦂', '🧌', '🦇', '🐙', '💀'];
const BADGES = [
  { id: 'first-step', icon: '👣', name: 'Langkah Pertama', desc: 'Menyelesaikan task pertama', test: p => p.tasksCompleted >= 1 },
  { id: 'seven-days', icon: '🔥', name: 'Tujuh Hari', desc: 'Streak 7 hari', test: p => p.streak.longest >= 7 },
  { id: 'thirty-days', icon: '🌕', name: 'Sebulan Penuh', desc: 'Streak 30 hari', test: p => p.streak.longest >= 30 },
  { id: 'quest-hunter', icon: '🏹', name: 'Pemburu Quest', desc: 'Menuntaskan 5 Quest bulanan', test: p => p.questsCompleted >= 5 },
  { id: 'year-conqueror', icon: '👑', name: 'Penakluk Tahun', desc: 'Menuntaskan 1 Epic tahunan', test: p => p.epicsCompleted >= 1 },
  { id: 'early-bird', icon: '🌅', name: 'Bangun Pagi', desc: '10 task selesai sebelum 09.00', test: p => p.earlyCount >= 10 },
  { id: 'all-clear', icon: '✨', name: 'Beres Total', desc: '7 hari dengan semua task tuntas', test: p => p.allDoneDates.length >= 7 },
];
const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const MONTHS_S = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const DAYNAMES = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const DAYS_S = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const monthOf = s => s.slice(0, 7);
const curMonth = () => monthOf(today());
const curYear = () => new Date().getFullYear();

}

/* ---------- day rollover ---------- */
function runDayChecks() {

  }

/* ---------- core action: complete a task ---------- */
function toggleTask(id, srcEl) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (t.done) {
    t.done = false; t.completedAt = null;
    announce(`"${t.title}" ditandai belum selesai.`);
    save(); render(); return;
  }
  const rect = srcEl && srcEl.getBoundingClientRect();
  const now = new Date(), td = ymd(now), p = S.player, iso = isoLocal(now);
  const prevLevel = levelFor(p.xp);
  t.done = true; t.completedAt = iso;

  // streak dihitung dari tanggal penyelesaian (hari ini), bukan tanggal task
  const s = p.streak;
  if (s.lastDoneDate !== td) {
    s.current = (s.lastDoneDate && s.current > 0 && (s.lastDoneDate === addDays(td, -1) || bridged(s.lastDoneDate, td))) ? s.current + 1 : 1;
    s.lastDoneDate = td;
    s.longest = Math.max(s.longest, s.current);
  }

  let gained = 0; const bonuses = [];
  const award = (xp, label) => { gained += xp; p.xpLog[td] = (p.xpLog[td] || 0) + xp; p.coins += coinsFor(xp); if (label) bonuses.push(`${label} · +${xp} XP`); };

  if (t.xpAwarded == null) {
    const key = t.title.trim().toLowerCase().replace(/\s+/g, ' ') + '|' + t.date;
    if (p.awardedKeys[key]) {
      t.xpAwarded = 0; // task sama di tanggal sama sudah pernah memberi XP (hapus-buat-ulang)
    } else {
      const xp = taskXP(t.difficulty, s.current);
      t.xpAwarded = xp; p.awardedKeys[key] = t.date;
      p.tasksCompleted++;
      if (now.getHours() < 9) p.earlyCount++;
      award(xp);
    }
  }

  const todays = S.tasks.filter(x => x.date === td);
  if (todays.length && todays.every(x => x.done) && !p.allDoneDates.includes(td)) { p.allDoneDates.push(td); award(25, 'Semua task hari ini beres'); }

  const q = t.questId && questById(t.questId);
  if (q && q.status !== 'closed') {
    const qs = questStats(q);
    if (qs.complete && qs.total >= MIN_QUEST_TASKS) {
      if (!q.bonusAwarded) { q.bonusAwarded = true; q.completedAt = iso; p.questsCompleted++; award(200, `Quest tuntas: ${q.title}`); }
      if (!q.bossDefeatedAt && td <= lastDayOfMonth(q.month)) { q.bossDefeatedAt = iso; award(300, 'Boss dikalahkan'); }
    }
    const e = q.epicId && epicById(q.epicId);
    if (e && !e.bonusAwarded && epicStats(e).complete) {
      e.bonusAwarded = true; e.completedAt = iso; p.epicsCompleted++; award(1000, `Epic tuntas: ${e.title}`);
    }
  }

  p.xp += gained;
  if (S.meta.firstTaskSeconds == null && S.meta.onboardingStartedAt) S.meta.firstTaskSeconds = Math.round((now - new Date(S.meta.onboardingStartedAt)) / 1000);

  save(); render();
  if (gained > 0 && rect) floatXP(rect, gained);
  announce(`"${t.title}" selesai${gained ? `, +${gained} XP` : ''}.`);
  if (bonuses.length) setTimeout(() => toast(bonuses.map(b => '🎉 ' + esc(b)).join('<br>'), '', bonuses.length > 1), 120);
  const lv = levelFor(p.xp);
  if (lv > prevLevel) setTimeout(() => toast(`⬆️ Naik ke Level ${lv}!`, 'badge', true), 200);
  checkBadges();
}

  const p = S.player;

    p.badges.push(b.id);
    setTimeout(() => toast(`${b.icon} Badge terbuka: <b>${esc(b.name)}</b>`, 'badge', true), 350);

function heatmap(y) {
  const counts = doneCounts(), td = today();
  const start = `${y}-01-01`, end = `${y}-12-31`;
  const ws = S.settings.weekStart === 'sunday' ? 0 : 1;
  const offset = (parseYmd(start).getDay() - ws + 7) % 7;
  let cells = '', months = '', col = 0, total = 0;
  const monthCols = {};
  for (let i = 0; i < offset; i++) cells += '<i class="pad"></i>';
  let idx = offset;
  for (let d = start; d <= end; d = addDays(d, 1), idx++) {
    const n = counts[d] || 0; total += n;
    const lv = n === 0 ? 0 : n === 1 ? 1 : n <= 3 ? 2 : n <= 5 ? 3 : 4;
    col = Math.floor(idx / 7);
    const mm = Number(d.slice(5, 7)) - 1; if (!(mm in monthCols)) monthCols[mm] = col;
    cells += `<i class="l${lv}${d === td ? ' today' : ''}" title="${d}: ${n} task"></i>`;
  }
  const cols = col + 1;
  for (let c = 0; c < cols; c++) { const mm = Object.keys(monthCols).find(k => monthCols[k] === c); months += `<span>${mm != null ? MONTHS_S[mm] : ''}</span>`; }
  return `<div class="heat-wrap" role="img" aria-label="Heatmap konsistensi ${y}: ${total} task selesai"><div class="heat-months" aria-hidden="true">${months}</div><div class="heat">${cells}</div></div>

}

let modal = null; const modalQueue = [];
function openModal(cfg) { if (modal) closeModal({ skipQueue: true }); modal = Object.assign({ dismissable: true }, cfg, { returnFocus: cfg.returnFocus || document.activeElement }); drawModal(true); }
function drawModal(focus) {
  const root = $('#modal-root');
  if (!modal) { root.innerHTML = ''; root.hidden = true; return; }
  root.hidden = false;
  root.innerHTML = `<div class="backdrop" ${modal.dismissable ? 'data-act="modal-close"' : ''}></div>
    <div class="modal ${modal.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><h2 id="modal-title">${modal.title}</h2>${modal.dismissable ? '<button class="icon-btn" data-act="modal-close" aria-label="Tutup">✕</button>' : ''}</div>
      <div class="modal-body">${modal.body()}</div></div>`;
  const box = root.querySelector('.modal');
  modal.onMount && modal.onMount(box);
  if (focus !== false) { const f = box.querySelector('[autofocus]') || box.querySelector('input,select,textarea,button:not([data-act=modal-close])') || box; f.focus(); }
}
function refreshModal() { if (modal) drawModal(false); }
function closeModal(opts = {}) {
  if (!modal) return;
  const m = modal; modal = null; drawModal();
  m.onClose && m.onClose();
  if (!opts.skipQueue) { if (m.returnFocus && document.contains(m.returnFocus)) m.returnFocus.focus(); nextQueued(); }
}
function queueModal(fn) { modalQueue.push(fn); if (!modal) nextQueued(); }
function nextQueued() { if (modal) return; const fn = modalQueue.shift(); if (fn) fn(); }

function exportData() {

function importData(text) {
  let d; try { d = JSON.parse(text); } catch (e) { toast('File bukan JSON yang valid.', 'error'); return; }
  const err = validateImport(d);
  if (err) { toast('Import ditolak: ' + esc(err), 'error'); return; }
  if (!confirm(`Import akan menimpa data saat ini (${S.tasks.length} task, ${S.quests.length} Quest, ${S.epics.length} Epic). Snapshot otomatis disimpan. Lanjutkan?`)) return;
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify(S)); } catch (e) { if (!confirm('Snapshot gagal disimpan (penyimpanan penuh). Tetap import?')) return; }
  S = normalize(d); S.meta.onboarded = true; readOnly = false; loadError = null;
  saveNow(); closeModal({ skipQueue: true }); runDayChecks(); render(); toast('✅ Data berhasil diimport.');
}
function archiveYear(y) {
  const ys = String(y);
  const epics = S.epics.filter(e => e.year === y), quests = S.quests.filter(q => q.month.startsWith(ys)), tasks = S.tasks.filter(t => t.date.startsWith(ys));
  if (!epics.length && !quests.length && !tasks.length) { toast(`Tidak ada data ${y}.`); return false; }
  const xpLog = Object.fromEntries(Object.entries(S.player.xpLog).filter(([d]) => d.startsWith(ys)));
  download(`questline-arsip-${y}.json`, { schemaVersion: SCHEMA, type: 'questline-archive', year: y, archivedAt: isoLocal(new Date()), player: { name: S.player.name, xp: S.player.xp, level: levelFor(S.player.xp) }, epics, quests, tasks, xpLog });
  const eIds = new Set(epics.map(e => e.id)), qIds = new Set(quests.map(q => q.id)), tIds = new Set(tasks.map(t => t.id));
  S.epics = S.epics.filter(e => !eIds.has(e.id));
  S.quests = S.quests.filter(q => !qIds.has(q.id)); S.quests.forEach(q => { if (eIds.has(q.epicId)) q.epicId = null; });
  S.tasks = S.tasks.filter(t => !tIds.has(t.id)); S.tasks.forEach(t => { if (qIds.has(t.questId)) t.questId = null; });
  for (const d of Object.keys(xpLog)) delete S.player.xpLog[d]; // total XP & level tetap
  const ok = saveNow(); render();
  if (ok) toast(`🗄️ Data ${y} diarsipkan (${tasks.length} task).`);
  return ok;
}

function monthStats(m) {
  const done = S.tasks.filter(t => t.done && t.completedAt && t.completedAt.startsWith(m));
  const cm = curMonth();
  const days = m === cm ? parseYmd(today()).getDate() : m < cm ? daysInMonth(m) : 0;
  const qs = S.quests.filter(q => q.month === m);
  return { done: done.length, avg: days ? done.length / days : 0, qDone: qs.filter(q => questStats(q).complete).length, qTotal: qs.filter(q => q.status !== 'closed').length, xp: xpInRange(m), run: longestRun(m) };
}

  'reopen-quest': el => { const q = questById(el.dataset.id); q.status = 'active'; save(); render(); },
  'del-quest': el => {
    const q = questById(el.dataset.id); if (!confirm(`Hapus Quest "${q.title}"? Task di dalamnya tetap ada, hanya dilepas dari Quest.`)) return;
    S.quests = S.quests.filter(x => x !== q); S.tasks.forEach(t => { if (t.questId === q.id) t.questId = null; });
    S.recurring.forEach(r => { if (r.questId === q.id) r.questId = null; }); save(); render();
  },
  'new-epic': () => openEpicForm(),
  'edit-epic': el => openEpicForm(el.dataset.id),
  'del-epic': el => {
    const e = epicById(el.dataset.id); if (!confirm(`Hapus Epic "${e.title}"? Quest di bawahnya tetap ada sebagai Quest mandiri.`)) return;
    S.epics = S.epics.filter(x => x !== e); S.quests.forEach(q => { if (q.epicId === e.id) q.epicId = null; }); save(); render();
  },
  'open-shop': () => openShop(),
  'redeem': el => {
    const r = S.rewards.find(x => x.id === el.dataset.id); if (!r || S.player.coins < r.cost) return;
    if (!confirm(`Tukar ${r.cost} coin untuk "${r.title}"?`)) return;
    S.player.coins -= r.cost; S.redemptions.push({ id: uid('x'), rewardId: r.id, title: r.title, cost: r.cost, at: isoLocal(new Date()) });
    save(); render(); refreshModal(); toast(`🎁 Selamat menikmati: <b>${esc(r.title)}</b>`, 'badge', true);
  },
  'edit-reward': el => { editingReward = el.dataset.id; refreshModal(); },
  'cancel-reward': () => { editingReward = null; refreshModal(); },
  'del-reward': el => { const r = S.rewards.find(x => x.id === el.dataset.id); if (!r || !confirm(`Hapus reward "${r.title}"?`)) return; S.rewards = S.rewards.filter(x => x !== r); save(); refreshModal(); },
  'open-settings': () => openSettings(),
  'open-search': () => openSearch(),
  'toggle-theme': () => { S.settings.theme = S.settings.theme === 'light' ? 'dark' : 'light'; save(); render(); },
  'export': () => exportData(),
  'import': () => $('#import-file').click(),
  'restore-snapshot': () => {
    let raw; try { raw = localStorage.getItem(BACKUP_KEY); } catch (e) { }
    if (!raw || !confirm('Pulihkan snapshot terakhir sebelum import? Data saat ini akan ditimpa.')) return;
    try { const d = JSON.parse(raw); if (validateImport(d)) throw new Error(validateImport(d)); S = normalize(d); saveNow(); closeModal(); render(); toast('↩️ Snapshot dipulihkan.'); } catch (e) { toast('Snapshot rusak: ' + esc(e.message), 'error'); }
  },
  'archive-year': el => {
    const y = Number(el.dataset.year);
    if (!confirm(`Arsipkan semua data ${y}? File JSON akan diunduh, lalu data ${y} dihapus dari aplikasi. Total XP dan level tidak berubah.`)) return;
    if (archiveYear(y)) closeModal();
  },
  'reset-all': () => {
    if (!confirm('Hapus SEMUA data Questline di browser ini? Tindakan ini tidak bisa dibatalkan. Export dulu jika perlu.')) return;
    try { localStorage.removeItem(KEY); } catch (e) { }
    S = freshState(); readOnly = false; loadError = null; Object.assign(ob, { step: 1, epicId: null, questId: null });
    closeModal({ skipQueue: true }); render(); openOnboarding();
  },
  'use-freeze': () => {
    const s = S.player.streak, td = today();
    if (!streakInfo().rescuable) return;
    s.freezeAvailable--; s.frozenDates.push(addDays(td, -1));
    save(); render(); toast(`❄️ Streak Freeze dipakai. Streak ${s.current} hari aman — selesaikan 1 task hari ini untuk melanjutkan.`);
  },
  'dismiss-backup': () => { S.meta.backupDismissed = today(); save(); render(); },
  'open-review': el => openReview(el.dataset.month, false),
  'open-year-review': el => openYearReview(Number(el.dataset.year), false),
  'review-new-quest': () => { closeModal({ skipQueue: true }); view = 'monthly'; viewMonth = curMonth(); render(); openQuestForm(null, { month: curMonth() }); },
  'year-new-epic': () => { closeModal({ skipQueue: true }); view = 'yearly'; viewYear = curYear(); render(); openEpicForm(); },
  'goto': el => {
    view = el.dataset.view;
    if (el.dataset.date) viewDate = el.dataset.date;
    if (el.dataset.month) viewMonth = el.dataset.month;
    if (el.dataset.year) viewYear = Number(el.dataset.year);
    closeModal(); render();
  },
  'modal-close': () => closeModal(),
  'ob-back': () => { ob.step = Math.max(1, ob.step - 1); drawModal(); },
  'load-export-raw': () => { const blob = new Blob([loadError.raw], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `questline-raw-${today()}.json`; a.click(); },
  'load-reset': () => {
    if (!confirm('Mulai dengan data kosong? Data lama di browser akan ditimpa. Pastikan sudah export data mentah.')) return;
    readOnly = false; loadError = null; S = freshState(); saveNow(); closeModal({ skipQueue: true }); render(); openOnboarding();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-act-change=rule]')) { const box = $('#quick-days'); if (box) box.hidden = e.target.value !== 'days'; }
});
$('#import-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importData(String(r.result)); r.readAsText(f); e.target.value = '';
});

/* ---------- form handlers ---------- */
const F = {
  quick: (f, fd) => {
    const title = (fd.get('title') || '').trim(); if (!title) return;
    const difficulty = fd.get('difficulty'), questId = fd.get('questId') || null, rule = fd.get('rule');
    quickPrefs.difficulty = difficulty; quickPrefs.questId = questId || '';
    if (rule) {
      const days = fd.getAll('days').map(Number);
      if (rule === 'days' && !days.length) { toast('Pilih minimal satu hari untuk pengulangan.', 'error'); return; }
      const r = { id: uid('r'), title, difficulty, questId, rule, days: rule === 'days' ? days : [], startDate: viewDate, lastGenerated: null, createdAt: today() };
      S.recurring.push(r);
      if (viewDate <= today() && recurMatches(r, viewDate)) S.tasks.push(newTask({ title, date: viewDate, difficulty, questId, recurrence: { templateId: r.id } }));
      if (viewDate === today()) r.lastGenerated = today();
      toast(`🔁 Task berulang dibuat: ${esc(RULE_LABEL(r))}`);
    } else {
      S.tasks.push(newTask({ title, date: viewDate, difficulty, questId }));
    }
    save(); render(); announce(`Task "${title}" ditambahkan.`);
    const inp = document.querySelector('[data-fkey=quick]'); if (inp) inp.focus();
  },
  task: (f, fd) => {
    const id = f.dataset.id, title = fd.get('title').trim(); if (!title) return;
    const data = { title, date: fd.get('date'), difficulty: fd.get('difficulty'), questId: fd.get('questId') || null };
    if (id) Object.assign(S.tasks.find(t => t.id === id), data); else S.tasks.push(newTask(data));
    closeModal(); save(); render();
  },
  quest: (f, fd) => {
    const id = f.dataset.id, title = fd.get('title').trim(), month = fd.get('month');
    if (!title || !/^\d{4}-\d{2}$/.test(month)) { toast('Judul dan bulan wajib diisi.', 'error'); return; }
    const data = { title, month, epicId: fd.get('epicId') || null };
    if (id) Object.assign(questById(id), data);
    else S.quests.push(Object.assign({ id: uid('q'), status: 'active', bossDefeatedAt: null, createdAt: today() }, data));
    closeModal(); viewMonth = month; save(); render();
  },
  epic: (f, fd) => {
    const res = saveEpicFromForm(f, fd, f.dataset.id || null);
    if (typeof res === 'string') { toast(esc(res), 'error'); return; }
    closeModal(); save(); render();
  },
  reward: (f, fd) => {
    const title = fd.get('title').trim(), cost = Math.round(Number(fd.get('cost')));
    if (!title || !(cost > 0)) return;
    if (f.dataset.id) Object.assign(S.rewards.find(r => r.id === f.dataset.id), { title, cost });
    else S.rewards.push({ id: uid('r'), title, cost });
    editingReward = null; save(); refreshModal();
  },
  settings: (f, fd) => {
    S.player.name = fd.get('name').trim() || S.player.name; S.player.avatar = fd.get('avatar') || S.player.avatar;
    S.settings.theme = fd.get('theme'); S.settings.weekStart = fd.get('weekStart');
    save(); render(); toast('Pengaturan disimpan.');
  },
  carry: (f, fd) => {
    const ids = new Set(fd.getAll('t')), td = today();
    S.tasks.forEach(t => { if (ids.has(t.id)) t.date = td; });
    closeModal(); viewDate = td; save(); render(); toast(`⏭️ ${ids.size} task dipindah ke hari ini.`);
  },
  'review-quests': (f, fd) => {
    const cm = curMonth(); let carried = 0, closed = 0;
    for (const [k, v] of fd.entries()) { const q = questById(k.slice(2)); if (!q) continue; if (v === 'carry') { q.month = cm; carried++; } else { q.status = 'closed'; closed++; } }
    save(); render(); toast(`${carried} Quest dilanjutkan, ${closed} ditutup.`);
    f.remove();
  },
  'carry-epics': (f, fd) => {
    const cy = curYear(), ids = fd.getAll('carry');
    if (activeEpicCount(cy) + ids.length > MAX_ACTIVE_EPICS) { toast(`Maksimal ${MAX_ACTIVE_EPICS} Epic aktif di ${cy}.`, 'error'); return; }
    ids.forEach(id => { const e = epicById(id); if (e) e.year = cy; });
    save(); render(); toast(`${ids.length} Epic dibawa ke ${cy}.`); f.remove();
  },
  ob1: (f, fd) => { S.player.name = fd.get('name').trim(); S.player.avatar = fd.get('avatar') || '🧙'; ob.step = 2; save(); drawModal(); },
  ob2: (f, fd) => {
    if (ob.epicId && epicById(ob.epicId)) { const e = epicById(ob.epicId); e.title = fd.get('title').trim(); e.category = fd.get('category').trim() || 'Umum'; e.targetMetric = fd.get('targetMetric').trim(); e.color = fd.get('color'); }
    else { const res = saveEpicFromForm(f, fd, null); if (typeof res === 'string') { toast(esc(res), 'error'); return; } ob.epicId = res.created.id; }
    ob.step = 3; save(); drawModal();
  },
  ob3: (f, fd) => {
    const q = { id: uid('q'), epicId: ob.epicId, title: fd.get('title').trim(), month: curMonth(), status: 'active', bossDefeatedAt: null, createdAt: today() };
    S.quests.push(q); ob.questId = q.id; ob.step = 4; save(); drawModal();
  },
  ob4: (f, fd) => {
    const td = today();
    ['t1', 't2', 't3'].map(k => (fd.get(k) || '').trim()).filter(Boolean).forEach(title => S.tasks.push(newTask({ title, date: td, difficulty: 'medium', questId: ob.questId })));
    S.meta.onboarded = true; S.meta.lastReviewMonth = curMonth(); S.meta.lastYearReview = curYear(); S.meta.lastCarryPrompt = td;
    view = 'daily'; viewDate = td; quickPrefs.questId = ob.questId;
    closeModal(); saveNow(); render();
    toast('⚔️ Petualangan dimulai! Centang satu task untuk membuka badge pertama.');
    const first = document.querySelector('.check'); if (first) first.focus();
  },
};
document.addEventListener('submit', e => {
  const f = e.target, fn = F[f.dataset.form]; if (!fn) return;
  e.preventDefault(); fn(f, new FormData(f));
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (modal) {
    if (e.key === 'Escape' && modal.dismissable) { e.preventDefault(); closeModal(); return; }
    if (e.key === 'Tab') { // focus trap
      const els = [...$('#modal-root .modal').querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent !== null);
      if (!els.length) return;
      const first = els[0], last = els[els.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.metaKey || e.ctrlKey || e.altKey) {
    if (e.key === 'Escape' && tag === 'input') e.target.blur();
    return;
  }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); if (view !== 'daily') { view = 'daily'; render(); } const i = document.querySelector('[data-fkey=quick]'); if (i) i.focus(); }
  else if (e.key === '/') { e.preventDefault(); openSearch(); }
  else if (['1', '2', '3'].includes(e.key)) { view = ['daily', 'monthly', 'yearly'][Number(e.key) - 1]; render(); document.getElementById('tab-' + view).focus(); }
  else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.classList.contains('tab')) {
    const order = ['daily', 'monthly', 'yearly']; view = order[(order.indexOf(view) + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; render(); document.getElementById('tab-' + view).focus();
  }
});

/* ---------- startup ---------- */
async function detectPrivate() {
  if (!storageOk) return true;
  try { if (navigator.storage && navigator.storage.estimate) { const { quota } = await navigator.storage.estimate(); if (quota && quota < 120 * 1024 * 1024) return true; } } catch (e) { }
  return false;
}
function startupFlow() {
  if (loadError) {
    queueModal(() => openModal({
      title: '⚠️ Data tidak bisa dimuat', dismissable: false,
      body: () => `<p style="margin-top:0">${loadError.type === 'version' ? `Data di browser ini memakai skema versi <b>${esc(loadError.v)}</b>, lebih baru dari yang didukung aplikasi ini (versi ${SCHEMA}). Gunakan versi Questline yang lebih baru.` : 'Data tersimpan rusak dan tidak bisa dibaca.'}</p>
        <p class="muted">Aplikasi tidak menyimpan apa pun sampai kamu memilih. Export data mentah dulu agar tidak hilang.</p>
        <div class="actions"><button class="btn" data-act="load-export-raw">⬇️ Export data mentah</button><button class="btn" data-act="import">⬆️ Import file lain</button><button class="btn danger" data-act="load-reset">Mulai baru</button></div>`,
    }));
    return;
  }
  if (!S.meta.onboarded) { queueModal(openOnboarding); return; }
  if (S.meta.lastYearReview < curYear()) queueModal(() => openYearReview(curYear() - 1, true));
  if (S.meta.lastReviewMonth !== curMonth()) queueModal(() => openReview(addMonths(curMonth(), -1), true));
  if (S.meta.lastCarryPrompt !== today()) queueModal(() => { if (!openCarryOver()) { S.meta.lastCarryPrompt = today(); save(); nextQueued(); } });
}
let lastDay = today();
setInterval(() => {
  if (today() === lastDay) return;
  const prevDay = lastDay; lastDay = today();
  runDayChecks();
  if (viewDate === prevDay) viewDate = lastDay;
  if (!modal) { render(); startupFlow(); }
}, 60 * 1000);

if (!readOnly) runDayChecks();
render();
startupFlow();
detectPrivate().then(isPrivate => {
  let warned = false; try { warned = sessionStorage.getItem('questline.privateWarned') === '1'; } catch (e) { }
  if (isPrivate && !warned) {
    try { sessionStorage.setItem('questline.privateWarned', '1'); } catch (e) { }
    toast('🕶️ Sepertinya kamu memakai mode penyamaran atau penyimpanan terbatas. Data bisa hilang saat tab ditutup — export JSON secara rutin.', 'error');
  }
});
</script>
</body>
